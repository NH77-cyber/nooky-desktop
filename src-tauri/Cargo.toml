[package]
name = "nooky"
description = "Nooky Desktop — un petit nuage assistant en haut de l'écran (basé sur Coucou de Louis Raillé, licence MIT)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nooky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# Self-update from GitHub Releases (signed), and relaunch after installing.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain (login keychain), never a file.
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray", "NSString"] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSResponder",
  "NSRunningApplication",
  "NSWindow",
  "NSScreen",
  "NSGraphics",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux is not a target of Nooky Desktop, but the upstream backend is kept so
# the shared code still builds there. Secret Service over D-Bus.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
gtk = "0.18"
